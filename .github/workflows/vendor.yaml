on:
  # No `push:`: a pull request already checks its merge with main,
  # and the schedule checks main (r-actions README, "Pushes to main").
  schedule:
    - cron: "53 2 * * 0"
  workflow_dispatch:
  pull_request:

name: vendor

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

# Re-derives src/vendor/ from the pinned geoarrow-c commit with upstream's
# CMake bundler, and on pull requests fails when the vendored files change
# without src/vendor/PROVENANCE changing too.
jobs:
  vendor:
    uses: pedrobtz/r-actions/.github/workflows/vendor.yml@v1
    with:
      vendor-dir: src/vendor
      verify: tools/verify-vendor
      must-update: |
        src/vendor/PROVENANCE
