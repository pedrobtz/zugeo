# The oracle tests (design section 9). None of the oracle packages is a
# dependency of zugeo, so the tests that use them live in
# tests/testthat/*-ci-*.R, which .Rbuildignore leaves out of the package
# tarball: R CMD check and CRAN never run them. This workflow runs them from
# the source tree, with every oracle installed and ZUGEO_ORACLES=true, so a
# missing oracle fails rather than skips.
#
# zuarrow, geoarrow and nanoarrow for the coexistence test (Stage 0); sf,
# geos, s2 and wk for interchange by WKB (Stage 3); duckdb, with its spatial
# extension, for Hilbert keys (Stage 5). arrow joins with GeoParquet.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

name: oracles

permissions:
  contents: read

concurrency:
  group: oracles-${{ github.ref }}
  cancel-in-progress: true

jobs:
  oracles:
    runs-on: ubuntu-latest
    # R comes with the image, so the job does not wait on setup-r, which took
    # 21 to 29 minutes on GitHub's runners on 2026-11-06. The image installs
    # packages as binaries from Posit's repository.
    container: rocker/r-ver:4.5.2
    # 45, not 30, while installing the oracle packages stays slow.
    timeout-minutes: 45
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      ZUGEO_ORACLES: true
      ZUGEO_FETCH_FIXTURES: true
      NOT_CRAN: true
    steps:
      - uses: actions/checkout@v6

      # The image's repository is a snapshot from its R release (March 2026),
      # which predates zujson and the decimal version zuarrow needs.
      - name: Use the latest binary repository
        run: |
          echo 'options(repos = c(CRAN = "https://p3m.dev/cran/__linux__/noble/latest"))' \
            >> "$(Rscript -e 'cat(R.home("etc"))')/Rprofile.site"

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::devtools
            any::geoarrow
            any::nanoarrow
            any::sf
            any::geos
            any::s2
            any::wk
            any::duckdb
            github::pedrobtz/zuarrow

      - name: Run the oracle tests
        run: |
          devtools::test(filter = "^ci-", stop_on_failure = TRUE)
        shell: Rscript {0}
